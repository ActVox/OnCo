name: Gates
description: >
  Run the same gates as CI (validate, typecheck, lint, tests) over the working tree and report whether they passed,
  without failing the job. The refresh workflows fetch a snapshot, open a pull request and merge it unattended, so
  the tree they merge has to pass what a person's branch passes: `npm run validate` alone does not render a page, so
  a snapshot that grows a page past its markup budget (src/app/heavy-pages.test.ts) used to be merged red, or leave a
  failing pull request open every week. Never failing means the pull request is still opened when a gate fails, so the
  fetched data is not lost; the caller skips its merge step and labels the pull request for review instead.
outputs:
  passed:
    description: "true when every gate passed"
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: Names of the gates that failed, empty when they all passed.
    value: ${{ steps.run.outputs.failed }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        failed=""
        # The test command must match scripts/ship.sh, which passes --testTimeout=600000. It did not, and that one
        # difference held back every weekly data refresh: on 30 September 2026 seven bot pull requests were open and
        # all seven carried the same "Not merged: npx vitest run failed" comment. The failure was always the same
        # single test, the first render in src/app/heavy-pages.test.ts, which pays the cost of building the graph
        # and importing 1,400 modules before it can render anything. It measures 27 seconds locally and 107 on a
        # GitHub runner, against a default limit of 30. The eleven roadmap renders after it in the same file take
        # 5 to 23 milliseconds each, so nothing is slow here except the first one, and the limit was measuring the
        # runner rather than the page. Raising the wall-clock limit on a test is not raising a budget: no assertion
        # about page size, cost or quality is weakened, and heavy-pages.test.ts still holds its 300 KB markup limit.
        for gate in "npm run validate" "npm run typecheck" "npm run lint" "npx vitest run --testTimeout=600000 --hookTimeout=600000"; do
          echo "::group::$gate"
          if ! $gate; then failed="$failed$gate; "; fi
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "failed=${failed%; }" >> "$GITHUB_OUTPUT"
          echo "::warning title=Gates failed::${failed%; } — the pull request will be left for review, not merged"
        else
          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "failed=" >> "$GITHUB_OUTPUT"
        fi
